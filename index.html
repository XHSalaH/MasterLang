<body>
  <div id="__bundler_placeholder">Loading Master Lang – Learn English for free...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e=\"font-weight: 800; font-size: 17px; line-height: 1.2\">English<\u002Fdiv>\n<div lang=\"en\" style=\"font-size: 14px; color: #4A5162; margin-top: 2px\">Hello!<\u002Fdiv>\n<div style=\"margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 7px; background: #D9F2D9; color: #1F6324; font-size: 12px; font-weight: 700\">\n<svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5L20 7\"><\u002Fpath><\u002Fsvg>\nLearning now\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position: absolute; top: 44px; right: 4px; z-index: 2; width: 190px; display: flex; flex-direction: column; align-items: center\">\n<div style=\"position: relative; z-index: 2; margin-bottom: -14px; padding: 5px 14px; background: #FFFFFF; border: 1px solid #EEECE6; border-radius: 999px; font-size: 12.5px; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,0.05)\">Arabic<\u002Fdiv>\n<div style=\"width: 100%; height: 220px; box-sizing: border-box; padding: 30px 18px 22px; border-radius: 20px; background: #FFFFFF; border: 3px solid #E4DFFD; box-shadow: 0 14px 30px -10px rgba(40,30,90,0.16); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; text-align: center\">\n<div lang=\"ar\" dir=\"rtl\" aria-hidden=\"true\" style=\"font-size: 72px; line-height: 1; font-weight: 700; color: #3E2F9E\">ع<\u002Fdiv>\n<div lang=\"ar\" dir=\"rtl\" style=\"font-size: 26px; font-weight: 700; margin-top: 8px\">مرحبا<\u002Fdiv>\n<div style=\"font-size: 13px; color: #5E6575\">marhaba (hello)<\u002Fdiv>\n<\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position: absolute; bottom: -12px; left: 16px; width: 30px; height: 30px; border-radius: 50%; background: #FCF087; border: 2px solid #FFFFFF; box-shadow: 0 3px 8px rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center\">\n<svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"#8A6400\" stroke=\"#8A6400\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><path d=\"M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position: absolute; bottom: 24px; left: 28px; z-index: 2\">\n<div style=\"position: relative\">\n<div style=\"width: 176px; height: 176px; box-sizing: border-box; padding: 20px; border-radius: 20px; background: #F5EDE2; border: 3px solid #F3E6C9; box-shadow: 0 14px 30px -10px rgba(0,0,0,0.12); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; text-align: center\">\n<div aria-hidden=\"true\" style=\"font-size: 52px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; color: #16191D\">Fr<\u002Fdiv>\n<div lang=\"fr\" style=\"font-size: 22px; font-weight: 700; margin-top: 8px\">Bonjour<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position: absolute; bottom: -10px; right: -30px; padding: 8px 14px; background: #FFFFFF; border: 1px solid #EEECE6; border-radius: 12px; box-shadow: 0 6px 16px rgba(0,0,0,0.08); font-size: 13px; font-weight: 800\">French<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position: absolute; bottom: 4px; right: 20px; z-index: 3; display: flex; align-items: center; gap: 14px; padding: 12px 20px 12px 12px; background: #FFFFFF; border: 1px solid #EEECE6; border-radius: 18px; box-shadow: 0 12px 28px -8px rgba(0,0,0,0.12)\">\n<div lang=\"zh\" aria-hidden=\"true\" style=\"width: 60px; height: 60px; border-radius: 14px; background: #CDEFD0; color: #1F6324; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700\">中<\u002Fdiv>\n<div>\n<div style=\"font-weight: 800; font-size: 16px; line-height: 1.2\">Chinese<\u002Fdiv>\n<div style=\"font-size: 14px; color: #4A5162; margin-top: 2px\"><span lang=\"zh\">你好<\u002Fspan> (nǐ hǎo)<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Strip -->\n<section aria-label=\"The plan in short\" style=\"position: relative; border-top: 1px solid #E2DED5; border-bottom: 1px solid #E2DED5\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 28px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 28px\">\n<div><div style=\"font-size: 32px; font-weight: 800; letter-spacing: -0.02em\">3,000 words<\u002Fdiv><div style=\"font-size: 15px; color: #4A5162\">cover everyday English<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size: 32px; font-weight: 800; letter-spacing: -0.02em\">10 a day<\u002Fdiv><div style=\"font-size: 15px; color: #4A5162\">gets you there in about a year<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size: 32px; font-weight: 800; letter-spacing: -0.02em\">3–4 hours<\u002Fdiv><div style=\"font-size: 15px; color: #4A5162\">a week to really progress<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size: 32px; font-weight: 800; letter-spacing: -0.02em\">Free<\u002Fdiv><div style=\"font-size: 15px; color: #4A5162\">every guide, every lesson<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Advice -->\n<section id=\"advice\" style=\"position: relative; max-width: 1240px; margin: 0 auto; padding: 48px 24px 20px\">\n<h2 style=\"margin: 0; font-size: clamp(28px, 3.4vw, 40px); line-height: 1.1; font-weight: 800; letter-spacing: -0.03em; max-width: 640px\">Six rules for learning English faster<\u002Fh2>\n<p style=\"margin: 12px 0 0; max-width: 600px; color: #4A5162; font-size: 18px\">No tricks. These are the habits that work for any language — they’re exactly how I learned French. Click a rule to see the details.<\u002Fp>\n<\u002Fsection>\n\n<!-- Advice 1 -->\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 0 24px\">\n<button type=\"button\" sc-camel-on-click=\"{{r1.toggle}}\" aria-expanded=\"{{r1.expanded}}\" style=\"width: 100%; display: flex; align-items: center; gap: 20px; padding: 16px 0; border: 0; border-top: 1px solid #E2DED5; background: transparent; font: inherit; color: #16191D; text-align: left; cursor: pointer\">\n<span style=\"{{r1.numStyle}}\">1<\u002Fspan>\n<span style=\"flex: 1; min-width: 0\"><span style=\"display: block; font-size: clamp(19px, 2.2vw, 24px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.2\">Mix passive and active learning<\u002Fspan><span style=\"display: block; margin-top: 4px; font-size: 15.5px; color: #4A5162\">Watch and read, then speak and teach.<\u002Fspan><\u002Fspan>\n<span style=\"{{r1.chevStyle}}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{r1.open}}\" hint-placeholder-val=\"{{false}}\">\n<section style=\"max-width: 1240px; margin: 0 auto; padding: 4px 24px 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 48px; align-items: center\">\n<div style=\"max-width: 500px\">\n<p style=\"margin: 0; color: #4A5162\">The fastest and most effective way to learn is to combine both. Passive methods — listening, reading, watching — feed you the language. Active methods — discussing, practising, teaching someone else — make it stay.<\u002Fp>\n<p style=\"margin: 14px 0 0; color: #4A5162\">Watch a series, then explain an episode to a friend. Read an article, then write five sentences with its new words.<\u002Fp>\n<\u002Fdiv>\n<figure style=\"margin: 0; padding: 24px 22px; background: #FFFFFF; border: 1px solid #E2DED5; border-radius: 24px\">\n<figcaption style=\"font-size: 14px; font-weight: 700; margin-bottom: 18px\">The learning pyramid <span style=\"font-weight: 500; color: #5E6575\">— how much people tend to remember<\u002Fspan><\u002Ffigcaption>\n<div style=\"display: flex; gap: 14px\">\n<div aria-hidden=\"true\" style=\"width: 26px; border-radius: 999px; background: linear-gradient(#BDB2F4, #3E2F9E); display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 12px 0\">\n<span style=\"writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11px; font-weight: 700; color: #16191D\">Passive<\u002Fspan>\n<span style=\"writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11px; font-weight: 700; color: #FFFFFF\">Active<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 6px\">\n<sc-for list=\"{{pyramid}}\" as=\"t\" hint-placeholder-count=\"7\">\n<div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 128px; gap: 12px; align-items: center\">\n<div style=\"display: flex; justify-content: center\"><div style=\"{{t.barStyle}}\">{{t.pct}}<\u002Fdiv><\u002Fdiv>\n<div style=\"font-size: 14px; font-weight: 600\">{{t.label}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffigure>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- Advice 2 -->\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 0 24px\">\n<button type=\"button\" sc-camel-on-click=\"{{r2.toggle}}\" aria-expanded=\"{{r2.expanded}}\" style=\"width: 100%; display: flex; align-items: center; gap: 20px; padding: 16px 0; border: 0; border-top: 1px solid #E2DED5; background: transparent; font: inherit; color: #16191D; text-align: left; cursor: pointer\">\n<span style=\"{{r2.numStyle}}\">2<\u002Fspan>\n<span style=\"flex: 1; min-width: 0\"><span style=\"display: block; font-size: clamp(19px, 2.2vw, 24px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.2\">Keep going until English feels natural<\u002Fspan><span style=\"display: block; margin-top: 4px; font-size: 15.5px; color: #4A5162\">Four steps from not knowing to second nature.<\u002Fspan><\u002Fspan>\n<span style=\"{{r2.chevStyle}}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{r2.open}}\" hint-placeholder-val=\"{{false}}\">\n<section style=\"max-width: 1240px; margin: 0 auto; padding: 4px 24px 28px\">\n<div style=\"max-width: 640px\">\n<p style=\"margin: 0; color: #4A5162\">Don’t stop once you can “get by”. Keep learning until English comes to you the way your native language does — without thinking. Every learner climbs the same four steps.<\u002Fp>\n<\u002Fdiv>\n<div style=\"margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 14px; align-items: end\">\n<sc-for list=\"{{stages}}\" as=\"s\" hint-placeholder-count=\"4\">\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-size: 13px; font-weight: 700; color: #5B4BC4\">{{s.moment}}<\u002Fdiv>\n<div style=\"font-size: 18px; font-weight: 800; line-height: 1.2\">{{s.title}}<\u002Fdiv>\n<div style=\"font-size: 15px; color: #4A5162; min-height: 48px\">“{{s.quote}}”<\u002Fdiv>\n<div style=\"{{s.stepStyle}}\"><span style=\"font-size: 30px; font-weight: 800\">{{s.n}}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- Advice 3 -->\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 0 24px\">\n<button type=\"button\" sc-camel-on-click=\"{{r3.toggle}}\" aria-expanded=\"{{r3.expanded}}\" style=\"width: 100%; display: flex; align-items: center; gap: 20px; padding: 16px 0; border: 0; border-top: 1px solid #E2DED5; background: transparent; font: inherit; color: #16191D; text-align: left; cursor: pointer\">\n<span style=\"{{r3.numStyle}}\">3<\u002Fspan>\n<span style=\"flex: 1; min-width: 0\"><span style=\"display: block; font-size: clamp(19px, 2.2vw, 24px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.2\">Repetition is the key<\u002Fspan><span style=\"display: block; margin-top: 4px; font-size: 15.5px; color: #4A5162\">Review on day 1, 3 and 6 — like an Olympic athlete.<\u002Fspan><\u002Fspan>\n<span style=\"{{r3.chevStyle}}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{r3.open}}\" hint-placeholder-val=\"{{false}}\">\n<section style=\"max-width: 1240px; margin: 0 auto; padding: 4px 24px 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 48px; align-items: start\">\n<div style=\"max-width: 500px\">\n<p style=\"margin: 0; color: #4A5162\">Don’t get discouraged if you can’t remember a word the first time. Nobody does. Every review pushes the forgetting curve back, and each time you remember for longer.<\u002Fp>\n<p style=\"margin: 22px 0 0; font-size: 22px; line-height: 1.35; font-weight: 800; letter-spacing: -0.01em\">Don’t repeat for results. Repeat until you become a master.<\u002Fp>\n<\u002Fdiv>\n<figure style=\"margin: 0; padding: 22px 20px 16px; background: #FFFFFF; border: 1px solid #E2DED5; border-radius: 24px\">\n<figcaption style=\"font-size: 14px; font-weight: 700; margin-bottom: 10px\">What you remember in the 7 days after learning<\u002Ffigcaption>\n<svg role=\"img\" aria-label=\"Without review, memory falls to about 5% in a week. With reviews on days 1, 3 and 6, it stays above 50% and ends near 85%.\" sc-camel-view-box=\"0 0 520 320\" style=\"width: 100%; height: auto; display: block\">\n<g stroke=\"#ECE8E0\" stroke-width=\"1\"><line x1=\"44\" y1=\"30\" x2=\"504\" y2=\"30\"><\u002Fline><line x1=\"44\" y1=\"90\" x2=\"504\" y2=\"90\"><\u002Fline><line x1=\"44\" y1=\"150\" x2=\"504\" y2=\"150\"><\u002Fline><line x1=\"44\" y1=\"210\" x2=\"504\" y2=\"210\"><\u002Fline><\u002Fg>\n<line x1=\"44\" y1=\"270\" x2=\"504\" y2=\"270\" stroke=\"#16191D\" stroke-width=\"1.5\"><\u002Fline>\n<g font-size=\"12\" fill=\"#5E6575\" font-family=\"Plus Jakarta Sans, sans-serif\"><text x=\"36\" y=\"34\" text-anchor=\"end\">100%<\u002Ftext><text x=\"36\" y=\"154\" text-anchor=\"end\">50%<\u002Ftext><text x=\"36\" y=\"274\" text-anchor=\"end\">0%<\u002Ftext>\n<text x=\"44\" y=\"292\" text-anchor=\"middle\">0<\u002Ftext><text x=\"110\" y=\"292\" text-anchor=\"middle\">1<\u002Ftext><text x=\"175\" y=\"292\" text-anchor=\"middle\">2<\u002Ftext><text x=\"241\" y=\"292\" text-anchor=\"middle\">3<\u002Ftext><text x=\"307\" y=\"292\" text-anchor=\"middle\">4<\u002Ftext><text x=\"372\" y=\"292\" text-anchor=\"middle\">5<\u002Ftext><text x=\"438\" y=\"292\" text-anchor=\"middle\">6<\u002Ftext><text x=\"504\" y=\"292\" text-anchor=\"middle\">7<\u002Ftext>\n<text x=\"274\" y=\"314\" text-anchor=\"middle\">Days after learning<\u002Ftext><\u002Fg>\n<path d=\"M44 30 C 64 90, 84 135, 110 150 C 200 220, 340 258, 504 258\" fill=\"none\" stroke=\"#9AA0AD\" stroke-width=\"2\" stroke-dasharray=\"5 5\"><\u002Fpath>\n<text x=\"330\" y=\"246\" font-size=\"12.5\" font-weight=\"600\" fill=\"#5E6575\" font-family=\"Plus Jakarta Sans, sans-serif\">No review<\u002Ftext>\n<path d=\"M44 30 C 64 90, 84 135, 110 150 L110 30 C 160 85, 205 135, 241 150 L241 30 C 310 95, 380 140, 438 150 L438 30 C 462 55, 484 64, 504 66\" fill=\"none\" stroke=\"#5B4BC4\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath>\n<g fill=\"#5B4BC4\"><circle cx=\"110\" cy=\"150\" r=\"5\"><\u002Fcircle><circle cx=\"241\" cy=\"150\" r=\"5\"><\u002Fcircle><circle cx=\"438\" cy=\"150\" r=\"5\"><\u002Fcircle><\u002Fg>\n<text x=\"118\" y=\"174\" font-size=\"12.5\" font-weight=\"700\" fill=\"#3E2F9E\" font-family=\"Plus Jakarta Sans, sans-serif\">Review<\u002Ftext>\n<text x=\"452\" y=\"58\" font-size=\"12.5\" font-weight=\"700\" fill=\"#3E2F9E\" font-family=\"Plus Jakarta Sans, sans-serif\" text-anchor=\"end\">With reviews<\u002Ftext>\n<\u002Fsvg>\n<\u002Ffigure>\n<\u002Fsection>\n\n<section style=\"max-width: 1240px; margin: 0 auto; padding: 12px 24px 28px\">\n<div style=\"padding: clamp(28px, 4vw, 48px); background: #16191D; color: #FFFFFF; border-radius: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 32px; align-items: start\">\n<div>\n<h4 style=\"margin: 0; font-size: 26px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em\">How Olympic champions use repetition<\u002Fh4>\n<p style=\"margin: 16px 0 0; color: #C9CCD4\">Champions don’t practise until they get it right. They repeat the movement until they can’t get it wrong.<\u002Fp>\n<p style=\"margin: 16px 0 0; color: #C9CCD4\">So if English is taking a long time, it usually just means you haven’t given it enough time yet.<\u002Fp>\n<\u002Fdiv>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; font-size: 15.5px\">\n<li style=\"display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; padding-bottom: 14px; border-bottom: 1px solid #343842\"><strong>10,000 hours<\u002Fstrong><span style=\"color: #C9CCD4\">of deliberate practice — about 20–30 hours a week for 8–12 years.<\u002Fspan><\u002Fli>\n<li style=\"display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; padding-bottom: 14px; border-bottom: 1px solid #343842\"><strong>Swimmers<\u002Fstrong><span style=\"color: #C9CCD4\">swim 60–100 km a week — tens of thousands of strokes.<\u002Fspan><\u002Fli>\n<li style=\"display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; padding-bottom: 14px; border-bottom: 1px solid #343842\"><strong>Gymnasts<\u002Fstrong><span style=\"color: #C9CCD4\">perform the same routine 50–100 times a day, for years.<\u002Fspan><\u002Fli>\n<li style=\"display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; padding-bottom: 14px; border-bottom: 1px solid #343842\"><strong>Archers<\u002Fstrong><span style=\"color: #C9CCD4\">release 400–500 arrows a day to perfect their aim.<\u002Fspan><\u002Fli>\n<li style=\"display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px\"><strong>In their heads<\u002Fstrong><span style=\"color: #C9CCD4\">they replay their race hundreds of times. Visualising uses the same brain areas as the real movement.<\u002Fspan><\u002Fli>\n<\u002Ful>\n<div role=\"img\" aria-label=\"Expert formula: 10 years times 2.75 hours a day equals about 10,000 hours\" style=\"position: relative; padding: 26px 22px 24px; background: #F7D93B; color: #16191D; border: 3px solid #16191D; border-radius: 22px; text-align: center; box-shadow: 6px 6px 0 #5B4BC4\">\n<span aria-hidden=\"true\" class=\"ml-spin\" style=\"position: absolute; top: -18px; right: -14px; width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 2.5px solid #16191D; display: flex; align-items: center; justify-content: center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#16191D\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12l5 5L20 7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<div aria-hidden=\"true\">\n<div style=\"display: inline-block; padding: 3px 12px; border: 2px solid #16191D; border-radius: 8px; background: #FFFFFF; font-size: 13px; font-weight: 800; letter-spacing: 0.06em\">EXPERT FORMULA<\u002Fdiv>\n<div style=\"margin-top: 16px; font-size: 32px; font-weight: 800; letter-spacing: 0.02em; line-height: 1.15\">10 YEARS ×<\u002Fdiv>\n<div style=\"margin-top: 4px; font-size: 32px; font-weight: 800; letter-spacing: 0.02em; line-height: 1.15\"><span style=\"border-bottom: 3px solid #16191D\">2.75 H/DAY<\u002Fspan> =<\u002Fdiv>\n<div style=\"margin-top: 18px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap\"><span class=\"ml-bob\" style=\"width: 46px; height: 46px; border: 2.5px solid #16191D; border-radius: 12px; background: #FFF8C9; display: flex; align-items: center; justify-content: center; animation-delay: 0s\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#16191D\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z\"><\u002Fpath><path d=\"M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"ml-bob\" style=\"width: 46px; height: 46px; border: 2.5px solid #16191D; border-radius: 12px; background: #FFF8C9; display: flex; align-items: center; justify-content: center; animation-delay: .2s\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#16191D\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 14v-2a8 8 0 0 1 16 0v2\"><\u002Fpath><rect x=\"3\" y=\"14\" width=\"4\" height=\"6\" rx=\"1.5\"><\u002Frect><rect x=\"17\" y=\"14\" width=\"4\" height=\"6\" rx=\"1.5\"><\u002Frect><\u002Fsvg><\u002Fspan><span class=\"ml-bob\" style=\"width: 46px; height: 46px; border: 2.5px solid #16191D; border-radius: 12px; background: #FFF8C9; display: flex; align-items: center; justify-content: center; animation-delay: .4s\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#16191D\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5h16v11H9l-5 4z\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"ml-bob\" style=\"width: 46px; height: 46px; border: 2.5px solid #16191D; border-radius: 12px; background: #FFF8C9; display: flex; align-items: center; justify-content: center; animation-delay: .6s\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#16191D\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"><\u002Frect><path d=\"M5 11a7 7 0 0 0 14 0M12 18v3\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"ml-bob\" style=\"width: 46px; height: 46px; border: 2.5px solid #16191D; border-radius: 12px; background: #FFF8C9; display: flex; align-items: center; justify-content: center; animation-delay: .8s\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#16191D\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20l4-1L19 8l-3-3L5 16z\"><\u002Fpath><path d=\"M14 7l3 3\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fdiv>\n<div class=\"ml-pop\" style=\"margin-top: 18px; display: inline-block; padding: 6px 16px; background: #16191D; color: #F7D93B; border-radius: 12px; font-size: 34px; font-weight: 800; letter-spacing: 0.02em\">10,000 HRS<\u002Fdiv>\n<div style=\"margin-top: 12px; font-size: 13px; font-weight: 600\">10 × 365 days × 2.75 h ≈ 10,000 hours<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- Advice 4 -->\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 0 24px\">\n<button type=\"button\" sc-camel-on-click=\"{{r4.toggle}}\" aria-expanded=\"{{r4.expanded}}\" style=\"width: 100%; display: flex; align-items: center; gap: 20px; padding: 16px 0; border: 0; border-top: 1px solid #E2DED5; background: transparent; font: inherit; color: #16191D; text-align: left; cursor: pointer\">\n<span style=\"{{r4.numStyle}}\">4<\u002Fspan>\n<span style=\"flex: 1; min-width: 0\"><span style=\"display: block; font-size: clamp(19px, 2.2vw, 24px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.2\">Just don’t stop<\u002Fspan><span style=\"display: block; margin-top: 4px; font-size: 15.5px; color: #4A5162\">Missed a day? Do it tomorrow.<\u002Fspan><\u002Fspan>\n<span style=\"{{r4.chevStyle}}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{r4.open}}\" hint-placeholder-val=\"{{false}}\">\n<section style=\"max-width: 1240px; margin: 0 auto; padding: 4px 24px 28px\">\n<div style=\"max-width: 640px\">\n<p style=\"margin: 0; color: #4A5162\">Can’t study today? Do it tomorrow. Missing a day is fine. Quitting is the only thing that stops you.<\u002Fp>\n<div aria-label=\"A week where one day is skipped but learning continues\" role=\"img\" style=\"margin-top: 20px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px\">\n<sc-for list=\"{{week}}\" as=\"d\" hint-placeholder-count=\"7\">\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px\">\n<div style=\"{{d.dotStyle}}\">\n<sc-if value=\"{{d.done}}\" hint-placeholder-val=\"{{true}}\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5L20 7\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n<\u002Fdiv>\n<span style=\"font-size: 12px; font-weight: 600; color: #5E6575\">{{d.day}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- Advice 5 -->\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 0 24px\">\n<button type=\"button\" sc-camel-on-click=\"{{r5.toggle}}\" aria-expanded=\"{{r5.expanded}}\" style=\"width: 100%; display: flex; align-items: center; gap: 20px; padding: 16px 0; border: 0; border-top: 1px solid #E2DED5; background: transparent; font: inherit; color: #16191D; text-align: left; cursor: pointer\">\n<span style=\"{{r5.numStyle}}\">5<\u002Fspan>\n<span style=\"flex: 1; min-width: 0\"><span style=\"display: block; font-size: clamp(19px, 2.2vw, 24px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.2\">Your effort is 80% of the work<\u002Fspan><span style=\"display: block; margin-top: 4px; font-size: 15.5px; color: #4A5162\">The teacher draws the plan. You build it.<\u002Fspan><\u002Fspan>\n<span style=\"{{r5.chevStyle}}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{r5.open}}\" hint-placeholder-val=\"{{false}}\">\n<section style=\"max-width: 1240px; margin: 0 auto; padding: 4px 24px 28px\">\n<div style=\"max-width: 640px\">\n<p style=\"margin: 0; color: #4A5162\">No teacher can learn for you. The teacher is the architect who draws the plan; you are the builder who lays every brick.<\u002Fp>\n<div style=\"margin-top: 20px; display: flex; height: 64px; border-radius: 14px; overflow: hidden; font-weight: 800\">\n<div style=\"width: 20%; background: #E4DFFD; color: #16191D; display: flex; align-items: center; justify-content: center; font-size: 18px\">20%<\u002Fdiv>\n<div style=\"width: 80%; background: #5B4BC4; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 22px\">80%<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 10px; display: flex; font-size: 14px; color: #4A5162\">\n<div style=\"width: 20%; text-align: center\"><strong style=\"color: #16191D\">Teacher<\u002Fstrong><br>architect<\u002Fdiv>\n<div style=\"width: 80%; text-align: center\"><strong style=\"color: #16191D\">You<\u002Fstrong><br>builder<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- Advice 6 -->\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 0 24px\">\n<button type=\"button\" sc-camel-on-click=\"{{r6.toggle}}\" aria-expanded=\"{{r6.expanded}}\" style=\"width: 100%; display: flex; align-items: center; gap: 20px; padding: 16px 0; border: 0; border-top: 1px solid #E2DED5; background: transparent; font: inherit; color: #16191D; text-align: left; cursor: pointer\">\n<span style=\"{{r6.numStyle}}\">6<\u002Fspan>\n<span style=\"flex: 1; min-width: 0\"><span style=\"display: block; font-size: clamp(19px, 2.2vw, 24px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.2\">Give it 3 to 4 hours a week<\u002Fspan><span style=\"display: block; margin-top: 4px; font-size: 15.5px; color: #4A5162\">30 minutes keeps you level. Progress needs more.<\u002Fspan><\u002Fspan>\n<span style=\"{{r6.chevStyle}}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{r6.open}}\" hint-placeholder-val=\"{{false}}\">\n<section style=\"max-width: 1240px; margin: 0 auto; padding: 4px 24px 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 48px; align-items: start\">\n<div style=\"max-width: 460px\">\n<p style=\"margin: 0; color: #4A5162\">Thirty minutes a week is the minimum — but it only keeps what you already know. To actually improve, you need at least three times more.<\u002Fp>\n<p style=\"margin: 14px 0 0; color: #4A5162\">Your brain keeps the paths you use and slowly prunes the ones you don’t.<\u002Fp>\n<\u002Fdiv>\n<div style=\"overflow-x: auto; background: #FFFFFF; border: 1px solid #E2DED5; border-radius: 24px\">\n<sc-raw-table style=\"width: 100%; min-width: 520px; border-collapse: collapse; font-size: 15px\">\n<sc-raw-thead>\n<sc-raw-tr style=\"text-align: left; color: #5E6575; font-size: 13px\">\n<sc-raw-th scope=\"col\" style=\"padding: 20px 24px 12px; font-weight: 700\">Effort<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"padding: 20px 16px 12px; font-weight: 700\">Time<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"padding: 20px 24px 12px; font-weight: 700\">What happens<\u002Fsc-raw-th>\n<\u002Fsc-raw-tr>\n<\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr style=\"border-top: 1px solid #ECE8E0; background: #F3F1FD\"><sc-raw-th scope=\"row\" style=\"padding: 18px 24px; text-align: left; font-weight: 800; color: #3E2F9E\">Progress<\u002Fsc-raw-th><sc-raw-td style=\"padding: 18px 16px; font-weight: 600\">30+ min a day<\u002Fsc-raw-td><sc-raw-td style=\"padding: 18px 24px; color: #4A5162\">You build new paths and keep getting better.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr style=\"border-top: 1px solid #ECE8E0\"><sc-raw-th scope=\"row\" style=\"padding: 18px 24px; text-align: left; font-weight: 800\">Maintenance<\u002Fsc-raw-th><sc-raw-td style=\"padding: 18px 16px; font-weight: 600\">15–30 min a week<\u002Fsc-raw-td><sc-raw-td style=\"padding: 18px 24px; color: #4A5162\">You stay where you are. Nothing grows, nothing is lost.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr style=\"border-top: 1px solid #ECE8E0\"><sc-raw-th scope=\"row\" style=\"padding: 18px 24px; text-align: left; font-weight: 800\">Danger zone<\u002Fsc-raw-th><sc-raw-td style=\"padding: 18px 16px; font-weight: 600\">2–3 weeks off<\u002Fsc-raw-td><sc-raw-td style=\"padding: 18px 24px; color: #4A5162\">Small things start to fade.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr style=\"border-top: 1px solid #ECE8E0\"><sc-raw-th scope=\"row\" style=\"padding: 18px 24px; text-align: left; font-weight: 800\">Real loss<\u002Fsc-raw-th><sc-raw-td style=\"padding: 18px 16px; font-weight: 600\">3–6 months off<\u002Fsc-raw-td><sc-raw-td style=\"padding: 18px 24px; color: #4A5162\">Your brain starts pruning what you don’t use.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 0 24px\"><div style=\"border-top: 1px solid #E2DED5\"><\u002Fdiv><\u002Fdiv>\n\n<!-- Slider -->\n<div id=\"slides\" style=\"margin-top: 40px; border-top: 1px solid #E2DED5; scroll-margin-top: 12px\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 28px 24px 8px; display: flex; align-items: center; gap: 14px\">\n<button type=\"button\" sc-camel-on-click=\"{{prevSlide}}\" aria-label=\"Previous section\" style=\"flex-shrink: 0; width: 52px; height: 52px; border-radius: 50%; border: 1px solid #16191D; background: #FFFFFF; color: #16191D; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<div role=\"tablist\" aria-label=\"Sections\" style=\"flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; padding: 4px; background: #F1EDE5; border-radius: 999px\">\n<sc-for list=\"{{slides}}\" as=\"sl\" hint-placeholder-count=\"4\">\n<button type=\"button\" sc-camel-on-click=\"{{sl.go}}\" role=\"tab\" aria-selected=\"{{sl.selected}}\" style=\"{{sl.tabStyle}}\">{{sl.title}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<span style=\"flex-shrink: 0; font-size: 14px; font-weight: 700; color: #4A5162; min-width: 44px; text-align: center\">{{slideCount}}<\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{nextSlide}}\" aria-label=\"Next section\" style=\"flex-shrink: 0; width: 52px; height: 52px; border-radius: 50%; border: 0; background: #16191D; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{slide0}}\" hint-placeholder-val=\"{{true}}\">\n<!-- Story -->\n<section id=\"story\" style=\"margin-top: 16px; background: #F1EDE5; border-top: 1px solid #E2DED5; border-bottom: 1px solid #E2DED5\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 44px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 56px; align-items: start\">\n<div style=\"max-width: 480px\">\n<h2 style=\"margin: 0; font-size: clamp(28px, 3.4vw, 40px); line-height: 1.1; font-weight: 800; letter-spacing: -0.03em\">How I learned French with an anime<\u002Fh2>\n<p style=\"margin: 12px 0 0; color: #4A5162; font-size: 18px\">I watched Naruto with French subtitles and followed the same rules I’m giving you. Nothing more.<\u002Fp>\n<div style=\"margin-top: 24px; padding: 22px; background: #FFFFFF; border-radius: 22px; border: 1px solid #E2DED5\">\n<div style=\"font-size: 56px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: #5B4BC4\">80%<\u002Fdiv>\n<p style=\"margin: 12px 0 0; font-weight: 600\">After 10 episodes I didn’t need to take notes anymore — I understood about 80% of the dialogue.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column\">\n<sc-for list=\"{{story}}\" as=\"st\" hint-placeholder-count=\"5\">\n<li style=\"display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 20px; padding: 16px 0; border-bottom: 1px solid #DCD6CA\">\n<div><span style=\"display: inline-block; padding: 4px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DCD6CA; font-size: 12.5px; font-weight: 700\">{{st.tag}}<\u002Fspan><\u002Fdiv>\n<div>\n<div style=\"font-size: 18px; font-weight: 800\">{{st.title}}<\u002Fdiv>\n<p style=\"margin: 6px 0 0; color: #4A5162; font-size: 16px\">{{st.body}}<\u002Fp>\n<\u002Fdiv>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fsc-if>\n<sc-if value=\"{{slide1}}\" hint-placeholder-val=\"{{false}}\">\n<!-- Plan -->\n<section id=\"plan\" style=\"max-width: 1240px; margin: 0 auto; padding: 48px 24px 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 48px; align-items: center\">\n<div style=\"max-width: 500px\">\n<h2 style=\"margin: 0; font-size: clamp(28px, 3.4vw, 40px); line-height: 1.1; font-weight: 800; letter-spacing: -0.03em\">You only need about 3,000 words<\u002Fh2>\n<p style=\"margin: 12px 0 0; color: #4A5162; font-size: 18px\">Don’t make it difficult. Go step by step — the most important thing is to keep learning. Pick a pace you can hold.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 24px; background: #FFFFFF; border: 1px solid #E2DED5; border-radius: 24px\">\n<div role=\"group\" aria-label=\"Choose your pace\" style=\"display: inline-flex; padding: 4px; background: #F1EDE5; border-radius: 999px; gap: 4px\">\n<sc-for list=\"{{plans}}\" as=\"p\" hint-placeholder-count=\"2\">\n<button type=\"button\" sc-camel-on-click=\"{{p.pick}}\" aria-pressed=\"{{p.pressed}}\" style=\"{{p.btnStyle}}\">{{p.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px\">\n<div style=\"padding: 22px; border-radius: 18px; background: #F3F1FD\">\n<div style=\"font-size: 48px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: #3E2F9E\">{{perWeek}}<\u002Fdiv>\n<div style=\"margin-top: 8px; font-size: 15px; font-weight: 600\">new words a week<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding: 22px; border-radius: 18px; background: #F3F1FD\">\n<div style=\"font-size: 48px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: #3E2F9E\">{{perDay}}<\u002Fdiv>\n<div style=\"margin-top: 8px; font-size: 15px; font-weight: 600\">new words a day<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 22px 0 0; color: #4A5162; font-size: 15.5px\">{{planNote}}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fsc-if>\n<sc-if value=\"{{slide2}}\" hint-placeholder-val=\"{{false}}\">\n<!-- Tenses -->\n<section id=\"tenses\" style=\"border-top: 1px solid #E2DED5\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 48px 24px 24px\">\n<h2 style=\"margin: 0; font-size: clamp(28px, 3.4vw, 40px); line-height: 1.1; font-weight: 800; letter-spacing: -0.03em; max-width: 680px\">The 12 English verb tenses<\u002Fh2>\n<p style=\"margin: 12px 0 0; max-width: 620px; color: #4A5162; font-size: 18px\">Every tense is a time — past, present or future — plus one of four forms. Learn the four forms once and you can build all twelve.<\u002Fp>\n\n<div style=\"margin-top: 24px; overflow-x: auto; padding-bottom: 8px\">\n<div style=\"min-width: 940px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: grid; grid-template-columns: 210px repeat(3, minmax(0, 1fr)); gap: 10px\">\n<div><\u002Fdiv>\n<sc-for list=\"{{tenseTimes}}\" as=\"tt\" hint-placeholder-count=\"3\">\n<div style=\"{{tt.headStyle}}\">{{tt.name}}<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 210px repeat(3, minmax(0, 1fr)); gap: 10px\">\n<div style=\"display: flex; align-items: center; font-size: 13px; font-weight: 700; color: #5E6575\">Timeline<\u002Fdiv>\n<div aria-hidden=\"true\" style=\"grid-column: 2 / span 3; position: relative; height: 40px\">\n<svg sc-camel-view-box=\"0 0 900 40\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position: absolute; inset: 0; width: 100%; height: 100%\"><path d=\"M14 20 L886 20\" stroke=\"#16191D\" stroke-width=\"6\"><\u002Fpath><path d=\"M26 6 L4 20 L26 34 Z M874 6 L896 20 L874 34 Z\" fill=\"#16191D\"><\u002Fpath><\u002Fsvg>\n<div style=\"position: absolute; top: 11px; left: calc(16.66% - 9px); width: 18px; height: 18px; background: #5B4BC4; transform: rotate(45deg); border: 2px solid #FAF7F2; box-sizing: border-box\"><\u002Fdiv>\n<div style=\"position: absolute; top: 11px; left: calc(50% - 9px); width: 18px; height: 18px; background: #C08A00; transform: rotate(45deg); border: 2px solid #FAF7F2; box-sizing: border-box\"><\u002Fdiv>\n<div style=\"position: absolute; top: 11px; left: calc(83.33% - 9px); width: 18px; height: 18px; background: #2E8A35; transform: rotate(45deg); border: 2px solid #FAF7F2; box-sizing: border-box\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{tenseRows}}\" as=\"row\" hint-placeholder-count=\"4\">\n<div style=\"display: grid; grid-template-columns: 210px repeat(3, minmax(0, 1fr)); gap: 10px\">\n<div style=\"padding: 18px 16px 18px 0\">\n<div style=\"font-size: 18px; font-weight: 800\">{{row.aspect}}<\u002Fdiv>\n<div style=\"margin-top: 4px; font-size: 14.5px; color: #4A5162\">{{row.meaning}}<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{row.cells}}\" as=\"c\" hint-placeholder-count=\"3\">\n<div style=\"padding: 18px; background: #FFFFFF; border: 1px solid #E2DED5; border-radius: 16px\">\n<svg role=\"img\" aria-label=\"{{c.glyphLabel}}\" sc-camel-view-box=\"0 0 220 60\" style=\"width: 100%; max-width: 240px; height: auto; display: block; margin: 0 0 12px; padding: 6px 0; border-radius: 10px; background: {{c.soft}}\">\n<path d=\"M6 42 L214 42\" stroke=\"#BDB7AB\" stroke-width=\"2\"><\u002Fpath>\n<path d=\"M150 22 L150 54\" stroke=\"{{c.ink}}\" stroke-width=\"2\" stroke-dasharray=\"3 3\"><\u002Fpath>\n<text x=\"150\" y=\"15\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"{{c.ink}}\" font-family=\"Plus Jakarta Sans, sans-serif\">{{c.ref}}<\u002Ftext>\n<path d=\"{{c.line}}\" fill=\"none\" stroke=\"#16191D\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n<path d=\"{{c.mark}}\" fill=\"#16191D\" stroke=\"#16191D\" stroke-width=\"1\" stroke-linejoin=\"round\"><\u002Fpath>\n<\u002Fsvg>\n<div style=\"font-size: 13px; font-weight: 700; color: #5E6575\">{{c.name}}<\u002Fdiv>\n<div style=\"margin-top: 6px; font-size: 17px; line-height: 1.45\">{{c.pre}}<strong style=\"color: #3E2F9E\">{{c.verb}}<\u002Fstrong>{{c.post}}<\u002Fdiv>\n<div style=\"{{c.formulaStyle}}\">{{c.formula}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top: 20px; padding: 24px 28px; background: #16191D; color: #FFFFFF; border-radius: 22px; display: flex; flex-wrap: wrap; gap: 12px 40px; align-items: center\">\n<div style=\"font-size: 20px; font-weight: 800\">Tense = time + form<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 28px; font-size: 15px; color: #C9CCD4\">\n<span><strong style=\"color: #FFFFFF\">Simple<\u002Fstrong> a basic fact or action<\u002Fspan>\n<span><strong style=\"color: #FFFFFF\">Continuous<\u002Fstrong> an action in progress<\u002Fspan>\n<span><strong style=\"color: #FFFFFF\">Perfect<\u002Fstrong> a completed action<\u002Fspan>\n<span><strong style=\"color: #FFFFFF\">Perfect continuous<\u002Fstrong> an ongoing action with a duration<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<h3 style=\"margin: 36px 0 0; font-size: 26px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em\">Learn and practise the tenses<\u002Fh3>\n<div style=\"margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px\">\n<sc-for list=\"{{tensePractice}}\" as=\"tp\" hint-placeholder-count=\"3\">\n<a href=\"{{tp.url}}\" target=\"_blank\" rel=\"noopener\" style=\"display: flex; flex-direction: column; gap: 6px; padding: 22px; min-height: 100px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E2DED5; border-radius: 20px; text-decoration: none; color: #16191D\">\n<span style=\"font-size: 14px; font-weight: 700; color: #3E2F9E\">{{tp.kind}}<\u002Fspan>\n<span style=\"font-size: 19px; font-weight: 800; letter-spacing: -0.01em\">{{tp.site}}<\u002Fspan>\n<span style=\"font-size: 14px; color: #4A5162\">{{tp.why}}<\u002Fspan>\n<\u002Fa>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fsc-if>\n<sc-if value=\"{{slide3}}\" hint-placeholder-val=\"{{false}}\">\n<!-- Resources -->\n<section id=\"resources\" style=\"border-top: 1px solid #E2DED5\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 48px 24px 24px\">\n<h2 style=\"margin: 0; font-size: clamp(28px, 3.4vw, 40px); line-height: 1.1; font-weight: 800; letter-spacing: -0.03em; max-width: 680px\">Free resources to start today<\u002Fh2>\n<p style=\"margin: 12px 0 0; max-width: 600px; color: #4A5162; font-size: 18px\">Flashcard sets sorted by level, plus the best sites to practise each skill. Pick your level and learn 10 words a day.<\u002Fp>\n\n<div style=\"margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; align-items: start\">\n<sc-for list=\"{{levels}}\" as=\"lv\" hint-placeholder-count=\"3\">\n<div style=\"padding: 22px; background: #FFFFFF; border: 1px solid #E2DED5; border-radius: 24px\">\n<div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px\">\n<h3 style=\"margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em\">{{lv.name}}<\u002Fh3>\n<span style=\"{{lv.tagStyle}}\">{{lv.total}}<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin: 6px 0 0; font-size: 15px; color: #4A5162\">{{lv.blurb}}<\u002Fp>\n<ul style=\"margin: 20px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column\">\n<sc-for list=\"{{lv.sets}}\" as=\"s\" hint-placeholder-count=\"4\">\n<li style=\"border-top: 1px solid #ECE8E0\">\n<a href=\"{{s.url}}\" target=\"_blank\" rel=\"noopener\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 8px 0; text-decoration: none; color: #16191D\">\n<span style=\"font-size: 15.5px; font-weight: 600\">{{s.title}}<\u002Fspan>\n<span style=\"display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0\">\n<span style=\"font-size: 13px; font-weight: 700; color: #4A5162\">{{s.countLabel}}<\u002Fspan>\n<svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5B4BC4\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 17L17 7\"><\u002Fpath><path d=\"M8 7h9v9\"><\u002Fpath><\u002Fsvg>\n<\u002Fspan>\n<\u002Fa>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"margin-top: 20px; padding: 22px; background: #FFFFFF; border: 1px solid #E2DED5; border-radius: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px 32px; align-items: center\">\n<div>\n<h3 style=\"margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em\">Grammar<\u002Fh3>\n<p style=\"margin: 6px 0 0; font-size: 15px; color: #4A5162\">Learn the rules alongside your words.<\u002Fp>\n<\u002Fdiv>\n<ul style=\"margin: 0; padding: 0; list-style: none\">\n<sc-for list=\"{{grammar}}\" as=\"g\" hint-placeholder-count=\"2\">\n<li style=\"border-top: 1px solid #ECE8E0\">\n<a href=\"{{g.url}}\" target=\"_blank\" rel=\"noopener\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 8px 0; text-decoration: none; color: #16191D\">\n<span style=\"font-size: 15.5px; font-weight: 600\">{{g.title}}<\u002Fspan>\n<span style=\"display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0\">\n<span style=\"font-size: 13px; font-weight: 700; color: #4A5162\">{{g.note}}<\u002Fspan>\n<svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5B4BC4\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 17L17 7\"><\u002Fpath><path d=\"M8 7h9v9\"><\u002Fpath><\u002Fsvg>\n<\u002Fspan>\n<\u002Fa>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 32px 24px 24px\">\n<h3 style=\"margin: 0; font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em\">The best site for each skill<\u002Fh3>\n<div style=\"margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px\">\n<sc-for list=\"{{skills}}\" as=\"k\" hint-placeholder-count=\"5\">\n<a href=\"{{k.url}}\" target=\"_blank\" rel=\"noopener\" style=\"display: flex; flex-direction: column; gap: 6px; padding: 22px; min-height: 100px; box-sizing: border-box; background: #F3F1FD; border-radius: 20px; text-decoration: none; color: #16191D\">\n<span style=\"font-size: 14px; font-weight: 700; color: #3E2F9E\">{{k.skill}}<\u002Fspan>\n<span style=\"font-size: 19px; font-weight: 800; letter-spacing: -0.01em\">{{k.site}}<\u002Fspan>\n<span style=\"font-size: 14px; color: #4A5162\">{{k.why}}<\u002Fspan>\n<\u002Fa>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 20px 24px 28px\">\n<h3 style=\"margin: 0; font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em\">Free apps for your phone<\u002Fh3>\n<p style=\"margin: 14px 0 0; max-width: 600px; color: #4A5162\">Ten minutes on the bus counts. Pick one or two apps and open them every day.<\u002Fp>\n<div style=\"margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px\">\n<sc-for list=\"{{apps}}\" as=\"ap\" hint-placeholder-count=\"9\">\n<a href=\"{{ap.url}}\" target=\"_blank\" rel=\"noopener\" style=\"display: flex; flex-direction: column; gap: 8px; padding: 22px; min-height: 128px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E2DED5; border-radius: 20px; text-decoration: none; color: #16191D\">\n<span style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px\">\n<span style=\"font-size: 14px; font-weight: 700; color: #3E2F9E\">{{ap.kind}}<\u002Fspan>\n<span style=\"{{ap.tagStyle}}\">{{ap.price}}<\u002Fspan>\n<\u002Fspan>\n<span style=\"font-size: 19px; font-weight: 800; letter-spacing: -0.01em\">{{ap.name}}<\u002Fspan>\n<span style=\"font-size: 14px; color: #4A5162\">{{ap.why}}<\u002Fspan>\n<\u002Fa>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 20px 24px 28px\">\n<h3 style=\"margin: 0; font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em\">More free learning sites<\u002Fh3>\n<div style=\"margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px\">\n<sc-for list=\"{{moreSites}}\" as=\"m\" hint-placeholder-count=\"3\">\n<a href=\"{{m.url}}\" target=\"_blank\" rel=\"noopener\" style=\"display: flex; flex-direction: column; gap: 6px; padding: 22px; min-height: 100px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E2DED5; border-radius: 20px; text-decoration: none; color: #16191D\">\n<span style=\"font-size: 14px; font-weight: 700; color: #3E2F9E\">{{m.kind}}<\u002Fspan>\n<span style=\"font-size: 19px; font-weight: 800; letter-spacing: -0.01em\">{{m.site}}<\u002Fspan>\n<span style=\"font-size: 14px; color: #4A5162\">{{m.why}}<\u002Fspan>\n<\u002Fa>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 20px 24px 28px\">\n<h3 style=\"margin: 0; font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em\">Practise real conversation<\u002Fh3>\n<p style=\"margin: 14px 0 0; max-width: 600px; color: #4A5162\">Speaking only improves when you speak. Start free with a language partner, or practise with AI any time of day.<\u002Fp>\n<div style=\"margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 20px; align-items: start\">\n<sc-for list=\"{{convo}}\" as=\"c\" hint-placeholder-count=\"3\">\n<div style=\"padding: 22px; background: #FFFFFF; border: 1px solid #E2DED5; border-radius: 24px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\">\n<h4 style=\"margin: 0; font-size: 20px; font-weight: 800\">{{c.name}}<\u002Fh4>\n<span style=\"{{c.tagStyle}}\">{{c.tag}}<\u002Fspan>\n<\u002Fdiv>\n<ul style=\"margin: 16px 0 0; padding: 0; list-style: none\">\n<sc-for list=\"{{c.items} eholder-count=\"4\">\n<button type=\"button\" sc-camel-on-click=\"{{sl.go}}\" aria-current=\"{{sl.current}}\" style=\"{{sl.tabStyle}}\">{{sl.title}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<span style=\"flex-shrink: 0; font-size: 14px; font-weight: 700; color: #4A5162; min-width: 44px; text-align: center\">{{slideCount}}<\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{nextSlide}}\" aria-label=\"Next section\" style=\"flex-shrink: 0; width: 52px; height: 52px; border-radius: 50%; border: 0; background: #16191D; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- CTA -->\n<section id=\"ready\" style=\"max-width: 1240px; margin: 0 auto; padding: 24px 24px 64px\">\n<div style=\"position: relative; overflow: hidden; padding: clamp(32px, 4vw, 56px) clamp(24px, 5vw, 64px); border-radius: 32px; background: #EEEAFD; text-align: center\">\n<img src=\"31fd7788-e27f-4ad6-a854-52eca77980e5\" alt=\"\" style=\"width: 96px; height: 96px; display: block; margin: 0 auto 16px\">\n<h2 style=\"margin: 0; font-size: clamp(30px, 3.8vw, 44px); line-height: 1.08; font-weight: 800; letter-spacing: -0.035em\">So, are you ready?<\u002Fh2>\n<p style=\"margin: 18px auto 0; max-width: 520px; color: #3F4555; font-size: 18px\">Ten words today. Review them on day 1, 3 and 6. Then ten more tomorrow.<\u002Fp>\n<div style=\"margin-top: 32px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center\">\n<a href=\"#slides\" sc-camel-on-click=\"{{go1}}\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 30px; border-radius: 999px; background: #16191D; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none\ entations.' },\n      { tag: 'Rule 2', title: 'Hide the translation and test', body: 'I covered the translation and tried to remember. If I did, fine. If I didn’t, I wrote the word down again.' },\n      { tag: 'Rule 3', title: 'Watch every episode 3 to 5 times', body: 'Then I reused my new words in my presentations and reports.' },\n      { tag: 'Rule 4', title: 'Never stop', body: 'I kept reading articles and watching YouTube videos in French.' },\n      { tag: 'Rule 6', title: 'One hour every day', body: 'Not a marathon on weekends — one steady hour, every day.' }\n    ];\n    var self = this;\n    var defs = [\n      { id: '1y', label: 'In 1 year' },\n      { id: '2y', label: 'In 2 years' }\n    ];\n    var plans = defs.map(function (p) {\n      var on = self.state.plan === p.id;\n      return {\n        label: p.label,\n        pressed: on ? 'true' : 'false',\n        pick: function () { self.setState({ plan: p.id }); },\n        btnStyle: 'min-height:44px;padding:0 22px;border:0;border-radius:999px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;' + (on ? 'background:#16191D;color:#FFFFFF' : 'background:transparent;color:#16191D')\n      };\n    });\n    var tag = function (bg, fg) {\n      return 'display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;background:' + bg + ';color:' + fg;\n    };\n    var q = 'https://quizlet.com/';\n    var mk = function (title, count, url) {\n      return { title: title, url: url, countLabel: count ? count.toLocaleString('en-US') + ' words' : 'Set' };\n    };\n    var levels = [\n      { name: 'Beginner', total: '577+ words', blurb: 'Everyday words, the classroom and your first short texts.', tagStyle: tag('#D9F2D9', '#1F6324'), sets: [\n        mk('Beginner English Vocabulary', 81, q + '1062732006/beginner-english-vocabulary-flash-cards/?x=1jqU&i=6o1kld'),\n        mk('Classroom Vocabulary', 32, q + '1024252582/classroom-vocabulary-flash-cards/?x=1jqU&i=6o1kld'),\n        mk('The Reef, The Goal, Better Deal', 60, q + '1040005565/the-reef-the-goal-better-deal-flash-cards/?x=1jqU&i=6o1kld'),\n        mk('The Challenge, The Crime, Journey, Nanotechnology', 0, q + '899817473/the-challenge-the-crime-journey-nanotechnology-flash-cards/?x=1jqU&i=6o1kld'),\n        mk('Elementary Vocabulary', 404, q + 'be/536712147/elementary-vocabulary-flash-cards/?x=1jqU&i=6o1kld')\n      ] },\n      { name: 'Intermediate', total: '628 words', blurb: 'Talk about more topics and follow real conversations.', tagStyle: tag('#FCF087', '#5C4300'), sets: [\n        mk('Vocabulary – Intermediate', 14, q + 'tr/280595317/vocabulary-intermediate-flash-cards/?x=1jqU&i=6o1kld'),\n        mk('Intermediate', 288, q + 'ua/264865119/intermidiate-flash-cards/?x=1jqU&i=6o1kld'),\n        mk('English Intermediate', 172, q + 'kz/1048235559/english-intermediate-flash-cards/?x=1jqU&i=6o1kld'),\n        mk('Intermediate English', 114, q + 'co/486176319/intermediate-english-flash-cards/?x=1jqU&i=6o1kld'),\n        mk('English Shopping – Intermediate', 40, q + '792538575/english-shopping-intermediate-flash-cards/?x=1jqU&i=6o1kld')\n      ] },\n      { name: 'Advanced', total: '1,931 words', blurb: 'Precise, rich vocabulary for reading, work and study.', tagStyle: tag('#E4DFFD', '#3E2F9E'), sets: [\n        mk('English Advanced', 1532, q + 'ru/607789665/english-advanced-flash-cards/?x=1jqU&i=6o1kld'),\n        mk('Advanced A1 – Group B', 277, q + 'user/xHsalah_eddine/folders/advanced-a1-group-b?x=1xqU&i=6o1kld'),\n        mk('Advanced A2 – Group D', 122, q + 'user/xHsalah_eddine/folders/advanced-a2-group-d?x=1xqU&i=6o1kld')\n      ] }\n    ];\n    var grammar = [\n      { title: 'English Grammar in Use (4th edition)', note: 'Exercise solutions', url: q + 'explanations/textbook-solutions/english-grammar-in-use-4th-edition-9780521189088?x=1mqU&i=6o1kld' },\n      { title: 'Avoir expressions', note: 'French set', url: q + '4881835/avoir-expressions-flash-cards/?x=1jqU&i=6o1  + ';font-size:20px;font-weight:800;text-align:center' };\n    });\n    var T = function (ti, name, pre, verb, post, formula) {\n      var t = times[ti];\n      return { name: name, pre: pre, verb: verb, post: post, formula: formula,\n        formulaStyle: 'margin-top:12px;display:inline-block;padding:5px 10px;border-radius:8px;font-size:13px;font-weight:700;background:' + t.soft + ';color:' + t.fg };\n    };\n    var tenseRows = [\n      { aspect: 'Simple', meaning: 'A basic fact or action', cells: [\n        T(0, 'Past simple', 'She ', 'played', ' football yesterday.', 'Subject + past form (V2)'),\n        T(1, 'Present simple', 'She ', 'plays', ' football.', 'Subject + verb (+s/es)'),\n        T(2, 'Future simple', 'She ', 'will play', ' football tomorrow.', 'Subject + will + verb')\n      ] },\n      { aspect: 'Continuous', meaning: 'An action in progress', cells: [\n        T(0, 'Past continuous', 'She ', 'was playing', ' football at 5 pm.', 'was/were + verb-ing'),\n        T(1, 'Present continuous', 'She ', 'is playing', ' football now.', 'am/is/are + verb-ing'),\n        T(2, 'Future continuous', 'She ', 'will be playing', ' football at 5 pm.', 'will be + verb-ing')\n      ] },\n      { aspect: 'Perfect', meaning: 'A completed action', cells: [\n        T(0, 'Past perfect', 'She ', 'had played', ' football before dinner.', 'had + past participle (V3)'),\n        T(1, 'Present perfect', 'She ', 'has played', ' football.', 'has/have + past participle (V3)'),\n        T(2, 'Future perfect', 'She ', 'will have played', ' football by tomorrow.', 'will have + past participle (V3)')\n      ] },\n      { aspect: 'Perfect continuous', meaning: 'An ongoing action with a duration', cells: [\n        T(0, 'Past perfect continuous', 'She ', 'had been playing', ' football for 2 hours.', 'had been + verb-ing'),\n        T(1, 'Present perfect continuous', 'She ', 'has been playing', ' football for 2 hours.', 'has/have been + verb-ing'),\n        T(2, 'Future perfect continuo
